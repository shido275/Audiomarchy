# Audiomarchy — a persistent virtual cable.
#
# module-null-sink creates "Audiomarchy Loopback"; its monitor is remapped to
# an input called "Audiomarchy Loopback Mic". Record from the mic to capture
# the sink, or select the sink as an app's output to route it silently.
#
# Turn it off with: audiomarchy device loopback off

pulse.cmd = [
  {
    cmd = "load-module"
    args = "module-null-sink sink_name=audiomarchy_loopback sink_properties=device.description=Audiomarchy_Loopback"
  }
  {
    cmd = "load-module"
    args = "module-remap-source master=audiomarchy_loopback.monitor source_name=audiomarchy_loopback source_properties=device.description=Audiomarchy_Loopback_Mic"
  }
]
