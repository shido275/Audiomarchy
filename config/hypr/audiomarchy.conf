# Audiomarchy — studio window rules, sourced from ~/.config/hypr/hyprland.conf.
#
# The two things that make plugins feel native under Wayland:
#   1. bridged Windows plugin windows float instead of being tiled
#   2. DAWs are excluded from the compositor effects that cost frames

# Wine and yabridge windows are XWayland clients. Scaling them at a
# fractional scale blurs their UI and breaks mouse coordinates in plugin
# editors, so keep XWayland at 1:1.
xwayland {
  force_zero_scaling = true
}

# Bridged VST editors open as their own small floating windows. Tiling them
# makes them unusable and steals focus from the DAW.
windowrule = float on, match:class ^(yabridge.*|.*\.exe)$

# DAW windows: no blur, no shadow, no translucent background. Metering is
# easier to read at full opacity and the compositor has less to do.
windowrule = no_blur on, match:class ^(REAPER|reaper|Ardour|ardour.*|Bitwig.*|bitwig.*|Carla|carla|qtractor|Qtractor|Mixxx|mixxx)$
windowrule = no_shadow on, match:class ^(REAPER|reaper|Ardour|ardour.*|Bitwig.*|bitwig.*|Carla|carla|qtractor|Qtractor|Mixxx|mixxx)$
windowrule = opacity 1.0 1.0, match:class ^(REAPER|reaper|Ardour|ardour.*|Bitwig.*|bitwig.*|Carla|carla|qtractor|Qtractor|Mixxx|mixxx)$
