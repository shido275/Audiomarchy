# Audiomarchy — studio defaults for WirePlumber.
#
# By default WirePlumber suspends an idle ALSA node after a few seconds.
# In a studio that reads as "my interface disappeared" and the first note
# after a pause is clipped. Keep every node awake, and give ALSA a little
# headroom so scheduling jitter does not turn into xruns.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*" }
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        api.alsa.headroom = 1024
      }
    }
  }
]

node.rules = [
  {
    matches = [
      { node.name = "~.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
